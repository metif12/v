name: Selfhosted Hunt

on:
  workflow_dispatch:
  push:
    branches:
      - ci-hunt

permissions:
  contents: read

jobs:
  hunt-linux:
    runs-on: [self-hosted, wsl-local]
    timeout-minutes: 120
    env:
      VJOBS: '4'
      VTEST_FAIL_FAST: '1'
      # tcc lane: lighter builds (this box shares 16GB with the Windows lane).
      VFLAGS: -cc tcc -no-retry-compilation
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build V
        run: make -j4
      - name: Install dependencies for examples and tools
        # NOTE: postgresql + libpq-dev omitted (only needed for the db lane, not the compiler suite).
        # WSL apt sources are pointed at ir.archive.ubuntu.com for usable speeds.
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev sqlite3 libsqlite3-dev valgrind nodejs
          sudo apt-get install -y libfreetype6-dev libxi-dev libxcursor-dev libgl-dev libxrandr-dev libasound2-dev
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libwayland-egl1 libxkbcommon-x11-dev wayland-protocols libegl-dev
          sudo apt-get install -y libx11-dev libx11-xcb-dev libgl1-mesa-dri xauth xvfb
      - name: Cleancode
        run: ./v -silent test-cleancode
      - name: Compiler suite
        run: ./v -silent test vlib/v/

  hunt-windows:
    # Serialized after hunt-linux: this box shares 16GB between both lanes,
    # and parallel full-lane runs OOM-killed WSL (runner lost communication).
    needs: [hunt-linux]
    runs-on: [self-hosted, win-local]
    timeout-minutes: 120
    env:
      VJOBS: '4'
      VTEST_FAIL_FAST: '1'
      VFLAGS: -cc tcc -no-retry-compilation
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare private tool cache
        run: .\.github\workflows\setup_windows_tool_cache.ps1
      - name: Add Git usr/bin to PATH for env.exe
        # Hosted windows runners have Git usr/bin on PATH; self-hosted needs it
        # explicitly: compiler tests invoke `env VJOBS=2 ...` (see
        # vlib/v/compiler_tests/c_callback_const_qualifier_codegen_test.v).
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\usr\bin'
      - name: Build with makev.bat -tcc
        run: |
          .\makev.bat -tcc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build optimized compiler for vet
        # -fno-lto: scoop gcc ships no working LTO tools; without this the
        # -prod link dies in lto-wrapper (worse under parallel-lane load).
        run: |
          .\v.exe -cc gcc -cflags -fno-lto -o v.prod.exe -prod cmd/v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cleancode vet
        run: |
          $env:VTEST_CLEANCODE_STAGE = 'vet'
          .\v.prod.exe -silent test-cleancode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cleancode fmt
        run: |
          $env:VTEST_CLEANCODE_STAGE = 'fmt'
          .\v.prod.exe -silent test-cleancode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compiler suite
        run: |
          .\v.prod.exe -silent test vlib/v/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
